{% load static %} 
<!DOCTYPE html>
<html lang="en"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login UI</title>
<link rel="stylesheet" href="{% static 'index.css' %}"> 
</head>
<body> 
{% for message in messages %}
 <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
 <strong>Message :</strong> {{ message }}
<button type="button"class="close"data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span> </button> 
</div>
{% endfor %}

{% if user.is_authenticated %} 
<h3>Hello {{ fname }}</h3>
 <h4>You're successfully logged in.</h4>
<button type="submit"><a href="/signout">SignOut</a> </button>
{% else %} 
<div class="container"> 
<div class="left-panel"> 
<h2>LOGIN</h2>
<p>How to login your account?</p> 
<form>
{% csrf_token %}
<div class="input-box"> 
<label for="">Username</label> 
<i class="fa fa-user"></i> 
<input type="text"name="username" placeholder="Username">
</div> 
<div class="input-box">
<label for="">Password</label> 
<i class="fa fa-lock"></i>
<input type="password" name="password" placeholder="Password">
</div> 
<button type="submit"> <a href="/signin">Signin</a></button>
<button type="submit"><a href="/signup">Signup</a></button>
</form>
</div>
<img src="{% static 'image/career-guidance.jpeg' %}"
         class="logo"
         alt="Career Guidance">
</div> 
{% endif %}
</body> 
</html>
