{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Your Career Guidance</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 30px;
        }

        .ai-result {
            line-height: 1.7;
            color: #333;
        }

        .ai-result h1 {
            color: #4f46e5;
            text-align: left;
            margin-top: 30px;
        }

        .ai-result h2 {
            color: #4f46e5;
            margin-top: 35px;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
        }

        .ai-result h3 {
            color: #333;
            margin-top: 25px;
        }

        .ai-result strong {
            color: #222;
        }

        .ai-result ul,
        .ai-result ol {
            padding-left: 30px;
        }

        .ai-result li {
            margin-bottom: 8px;
        }

        .ai-result blockquote {
            margin: 20px 0;
            padding: 15px 20px;
            background: #eef0ff;
            border-left: 5px solid #4f46e5;
            border-radius: 8px;
        }

        .ai-result table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            overflow: hidden;
        }

        .ai-result th,
        .ai-result td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .ai-result th {
            background: #4f46e5;
            color: white;
        }

        .ai-result tr:nth-child(even) {
            background: #f8f9ff;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .back-btn:hover {
            background: #3730a3;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Your Career Guidance</h1>

    <div class="ai-result">

        {{ ai_result|safe }}

    </div>

    <a href="{% url 'index' %}" class="back-btn">
        Back to Home
    </a>

</div>

</body>

</html>
