{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Career Guidance</title>

    <link rel="stylesheet" href="{% static 'signin.css' %}">
    <style>
        .brand-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            text-decoration: none;
        }
        .brand-badge {
            width: 28px;
            height: 28px;
            background: #5842ed;
            color: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
        }
        .back-link {
            font-size: 13px;
            color: #64748b;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .back-link:hover {
            color: #5842ed;
        }
        .auth-alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 18px;
        }
        .auth-alert-error, .auth-alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .auth-alert-success {
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="left-side">
            <img src="{% static 'image/login-image.png' %}"
                 alt="Career Guidance">
        </div>

        <!-- RIGHT SIDE -->
        <div class="right-side">

            <div class="login-content">

                <div class="brand-top">
                    <a href="{% url 'index' %}" class="brand-logo">
                        <span class="brand-badge">CG</span>
                        <span>Career Guidance</span>
                    </a>
                    <a href="{% url 'signin' %}" class="back-link">← Back to Login</a>
                </div>

                <h1>Forgot Password?</h1>

                <p class="subtitle">
                    Reset your password to continue your career journey
                </p>

                {% if messages %}
                    <div class="auth-messages">
                        {% for message in messages %}
                            <div class="auth-alert auth-alert-{{ message.tags|default:'error' }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                <form action="{% url 'forgot_password' %}" method="POST">

                    {% csrf_token %}


                    <!-- Username -->
                    <div class="input-group">

                        <input
                            type="text"
                            name="username"
                            placeholder="Username"
                            required
                        >

                    </div>


                    <!-- New Password -->
                    <div class="input-group">

                        <input
                            type="password"
                            name="new_password"
                            placeholder="New Password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="input-group">

                        <input
                            type="password"
                            name="confirm_password"
                            placeholder="Confirm New Password"
                            required
                        >

                    </div>


                    <!-- Reset Button -->
                    <button type="submit" class="login-btn">
                        Reset Password
                    </button>

                </form>


                <!-- Back to Login -->
                <div class="create-account">

                    <span>Remember your password?</span>
                    <a href="{% url 'signin' %}">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
