{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="{% static 'signin.css' %}">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="left-side">

            <img src="{% static 'image/login-image.png' %}"
                 alt="Career Guidance">

        </div>


        <!-- RIGHT SIDE -->
        <div class="right-side">

            <div class="login-content">

                <h1>Forgot Password?</h1>

                <p class="subtitle">
                    Reset your password to continue your career journey
                </p>


                <form action="/forgot-password/" method="POST">

                    {% csrf_token %}


                    <!-- Username -->
                    <div class="input-group">

                        <input
                            type="text"
                            name="username"
                            placeholder="Username"
                            required
                        >

                    </div>


                    <!-- New Password -->
                    <div class="input-group">

                        <input
                            type="password"
                            name="new_password"
                            placeholder="New Password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->
                    <div class="input-group">

                        <input
                            type="password"
                            name="confirm_password"
                            placeholder="Confirm New Password"
                            required
                        >

                    </div>


                    <!-- Reset Button -->
                    <button type="submit" class="login-btn">
                        Reset Password
                    </button>

                </form>


                <!-- Back to Login -->
                <div class="create-account">

                    <span>Remember your password?</span>

                    <a href="/signin/">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
